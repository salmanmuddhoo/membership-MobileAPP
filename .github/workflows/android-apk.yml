name: Android APK

# Builds an installable APK from the code on GitHub, with no Expo account
# and no Android Studio: Expo generates the native project on the runner,
# Gradle builds it, and the APK is attached to the workflow run (and to the
# GitHub release when a tag is pushed). See docs/install-android.md.
#
# Two apps (docs/environments.md): the test app, "Al Barakah Test"
# (mu.albarakah.member.test), against the test site on Vercel; and the
# members' app, "Al Barakah" (mu.albarakah.member), against production on
# Azure. Each has its own package, so both install on one phone, and its
# own backend address, written in scripts/app-variants.js — nothing to type.
#
# Which code each is built from mirrors the backend's two branches: the
# test app from the branch the run was started from (main, unless another
# was picked), the members' app from the production branch and nothing
# else — promoted from main once tested, together with the backend's own
# production (docs/environments.md, "Promoting to production").
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app: test (Vercel test site) or production (Azure, for members)'
        default: test
        type: choice
        options: [test, production]
  # A version tag builds both apps and attaches both to the release.
  push:
    tags: ['v*']
  # A pull request that touches the build itself proves it still builds.
  pull_request:
    paths:
      - '.github/workflows/android-apk.yml'
      - 'scripts/android-signing.*'
      - 'scripts/app-variants.js'
      - 'scripts/firebase-config.sh'
      - 'app.json'
      - 'app.config.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  apk:
    name: Build APK (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The one chosen by hand; both on a tag; the test app for a pull
        # request.
        app: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.app) || github.event_name == 'push' && '["test","production"]' || '["test"]') }}
    env:
      APP: ${{ matrix.app }}
      # Which app the native project is generated as (scripts/app-variants.js).
      APP_VARIANT: ${{ matrix.app }}
      # Google Play needs every upload to carry a higher versionCode than
      # the last (app.config.js); the run number only ever goes up.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      # The members' app is the production branch's code, whatever branch
      # the run was started from; a tag builds what it names, and is
      # checked below to sit on the production branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.app == 'production' && github.event_name == 'workflow_dispatch' && 'production' || '' }}
          fetch-depth: 0

      - name: Note the commit being built
        run: |
          echo "BUILT_REF=${{ matrix.app == 'production' && github.event_name == 'workflow_dispatch' && 'production' || github.ref_name }}" >> "$GITHUB_ENV"
          # Shown on the app's first screen and in the APK's name, so a
          # person holding the phone can tell which build they are running.
          echo "EXPO_PUBLIC_BUILD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BUILT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: The members' app comes from the production branch
        if: matrix.app == 'production'
        run: |
          git fetch --no-tags origin production
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::The members' app is built from the production branch only. $(git rev-parse --short HEAD) is not on it: promote main to production first (docs/environments.md), and tag a commit on production."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # The package this app installs as and the site it talks to, both from
      # scripts/app-variants.js: the test site for the test app, production
      # on Azure for the members' app.
      - name: Name the app and its backend
        run: |
          node -e '
            const app = require("./scripts/app-variants").variant();
            require("fs").appendFileSync(process.env.GITHUB_ENV,
              `APP_PACKAGE=${app.package}\nEXPO_PUBLIC_API_MODE=live\nEXPO_PUBLIC_API_URL=${app.apiUrl}\n`);
            console.log(`${app.name} (${app.package}) talks to ${app.apiUrl}`);
          '

      # Push notifications need the Firebase configuration naming this
      # app's package (docs/push-notifications.md): its own secret if set
      # (GOOGLE_SERVICES_JSON_TEST / _PRODUCTION), else the shared one.
      # Without it the app still builds and runs; it just receives no
      # notifications, and the summary below says so.
      - name: Add the Firebase configuration, if there is one for this app
        env:
          GOOGLE_SERVICES_JSON: ${{ matrix.app == 'production' && (secrets.GOOGLE_SERVICES_JSON_PRODUCTION || secrets.GOOGLE_SERVICES_JSON) || (secrets.GOOGLE_SERVICES_JSON_TEST || secrets.GOOGLE_SERVICES_JSON) }}
        run: bash scripts/firebase-config.sh

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # A release APK must be signed. With ANDROID_KEYSTORE_BASE64 (and the
      # three passwords) set as repository secrets, every build is signed with
      # the same key, so a newer APK installs over an older one as an update.
      # Without them a throwaway key is generated for this run: the APK still
      # installs, but the next build will not update it in place — uninstall
      # first. The work is in scripts/android-signing.sh so it can be run and
      # read on its own.
      - name: Note whether the repository's key is set
        run: echo "HAS_KEYSTORE=${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}" >> "$GITHUB_ENV"

      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/android-signing.sh

      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # Google Play takes an App Bundle, not an APK, and only one signed with
      # the key registered on the Play Console — so the bundle is built only
      # for the members' app, and only when the repository's key is set. A
      # throwaway-signed bundle could never be uploaded.
      - name: Build the release App Bundle for Google Play
        if: env.HAS_KEYSTORE == 'true' && matrix.app == 'production'
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Name the APK (and the bundle)
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
            "out/albarakah-member-${APP}-${BUILT_SHA}.apk"
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab \
              "out/albarakah-member-${APP}-${BUILT_SHA}.aab"
          fi
          ls -la out

      # On the run's own page, not buried in the log. Whether this APK can
      # install over the last one is the single thing a person needs to know
      # before they pick up their phone, and getting it wrong looks like the
      # new build simply not taking effect — the app keeps running the old
      # code, and every fix in the new one appears not to work.
      - name: Say whether this APK can update the last one
        if: always()
        run: |
          {
            if [ "${APP}" = "production" ]; then
              echo "## Al Barakah — the members' app"
            else
              echo "## Al Barakah Test — the test app"
            fi
            echo
            echo "\`$(ls out 2>/dev/null | head -1)\`"
            echo
            echo "Installs as \`${APP_PACKAGE:-?}\` · backend: ${EXPO_PUBLIC_API_URL:-?}"
            echo
            echo "Built from \`${BUILT_REF:-?}\` at \`${BUILT_SHA:-?}\`."
            echo
            if [ "${HAS_FIREBASE}" = "true" ]; then
              echo "Push notifications: **on** (built with the Firebase configuration)."
            else
              echo "Push notifications: **off** — ${FIREBASE_NOTE:-no Firebase configuration} (docs/push-notifications.md)."
            fi
            echo
            if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
              echo "Signed with the repository's key: **installs over the previous build as an update.**"
              if [ "${APP}" = "production" ]; then
                echo
                echo "The \`.aab\` beside it (versionCode ${ANDROID_VERSION_CODE}) is what to upload to Google Play."
              fi
            else
              echo "> [!IMPORTANT]"
              echo "> Signed with a **throwaway key**, generated for this run alone."
              echo ">"
              echo "> **Uninstall this app from the phone before installing this.**"
              echo "> Android refuses to replace an app with one signed by a different key."
              echo "> Depending on the phone that shows as \"App not installed\" — or the"
              echo "> install appears to do nothing and the old version keeps running, so"
              echo "> whatever this build changed looks like it did not work."
              echo ">"
              echo "> To stop needing this, set the ANDROID_KEYSTORE_BASE64,"
              echo "> ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD"
              echo "> secrets — docs/install-android.md has the four commands."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: albarakah-member-${{ matrix.app }}
          path: |
            out/*.apk
            out/*.aab
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/*.aab
