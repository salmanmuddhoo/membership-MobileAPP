name: Android APK

# Builds an installable APK from the code on GitHub, with no Expo account
# and no Android Studio: Expo generates the native project on the runner,
# Gradle builds it, and the APK is attached to the workflow run (and to the
# GitHub release when a tag is pushed). See docs/install-android.md.
on:
  workflow_dispatch:
    inputs:
      api_mode:
        description: 'mock (no backend needed) or live'
        default: mock
        type: choice
        options: [mock, live]
      api_url:
        description: 'Backend origin, for live builds'
        default: ''
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_MODE: ${{ inputs.api_mode || 'mock' }}
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # A release APK must be signed. With ANDROID_KEYSTORE_BASE64 (and the
      # three passwords) set as repository secrets, every build is signed with
      # the same key, so a newer APK installs over an older one as an update.
      # Without them a throwaway key is generated for this run: the APK still
      # installs, but the next build will not update it in place — uninstall
      # first.
      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "Using the repository's signing key."
          else
            KEYSTORE_PASSWORD=throwaway; KEY_ALIAS=throwaway; KEY_PASSWORD=throwaway
            keytool -genkeypair -v -keystore android/app/release.keystore \
              -alias throwaway -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass throwaway -keypass throwaway \
              -dname "CN=Al Barakah preview, O=Al Barakah MCSL, C=MU"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signed with a throwaway key. Uninstall the previous build before installing this one."
          fi
          cat >> android/gradle.properties <<EOP
          ALBARAKAH_STORE_FILE=release.keystore
          ALBARAKAH_STORE_PASSWORD=$KEYSTORE_PASSWORD
          ALBARAKAH_KEY_ALIAS=$KEY_ALIAS
          ALBARAKAH_KEY_PASSWORD=$KEY_PASSWORD
          EOP
          # Point the generated project's release signing at that key.
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p).read()
          s = s.replace("""        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug""", """        release {
            signingConfig signingConfigs.release""")
          s = s.replace("""    signingConfigs {
        debug {""", """    signingConfigs {
        release {
            storeFile file(ALBARAKAH_STORE_FILE)
            storePassword ALBARAKAH_STORE_PASSWORD
            keyAlias ALBARAKAH_KEY_ALIAS
            keyPassword ALBARAKAH_KEY_PASSWORD
        }
        debug {""")
          open(p, 'w').write(s)
          PY
          grep -n "signingConfigs.release" android/app/build.gradle

      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
            "out/albarakah-member-${EXPO_PUBLIC_API_MODE}-${GITHUB_SHA::7}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: albarakah-member-apk
          path: out/*.apk
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
